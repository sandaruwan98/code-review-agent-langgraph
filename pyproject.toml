[project]
name = "code-review-agent"
version = "0.1.0"
description = "LangGraph-powered agent that autonomously reviews GitHub PRs for bugs, security issues, and code quality"
readme = "README.md"
authors = [
    { name = "sandaruwan98", email = "Laksan.Jayasinghe@thomsonreuters.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain-anthropic>=1.3.5",
    "langchain-openai>=1.0.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.19",
    "langgraph>=1.1.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "langgraph-checkpoint-sqlite>=3.0.3",
]

[project.scripts]
code-review-agent = "code_review_agent.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
