[project]
name = "code-review-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sandaruwan98", email = "Laksan.Jayasinghe@thomsonreuters.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "langchain-anthropic>=1.3.5",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.19",
    "langgraph>=1.1.2",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
]

[project.scripts]
code-review-agent = "code_review_agent:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
